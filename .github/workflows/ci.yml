name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "feature/**"
      - "fix/**"
      - "security/**"
  workflow_dispatch:

jobs:
  orchestrator:
    name: Orchestrator checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: presentonika-orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: presentonika-orchestrator/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Validate Docker Compose config
        env:
          PRESENTONIKA_ORCHESTRATOR_KEY: ci-only-key-ci-only-key-ci-only-key
          PUBLIC_ZIP_BASE_URL: https://example.test/orchestrator
        run: docker compose config --quiet

      - name: Validate production Docker Compose config
        env:
          PRESENTONIKA_ORCHESTRATOR_KEY: ci-only-key-ci-only-key-ci-only-key
          PUBLIC_ZIP_BASE_URL: https://example.test/orchestrator
        run: docker compose -f docker-compose.prod.yml config --quiet

      - name: Build production image
        run: docker build .
