services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - presentonika_shared

  orchestrator-api:
    build: .
    restart: unless-stopped
    command: ["node", "dist/server.js"]
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379
      LAYOUT_ENGINE_ENABLED: "true"
      LAYOUT_ENGINE_DIR: /app/layouts-local
      LAYOUT_ENGINE_FAIL_ON_MISSING_LAYOUT: "false"
      LAYOUT_ENGINE_VARIATION: "true"
      LAYOUT_DEBUG_LABEL: "true"
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./out:/app/out
      - ./.tmp:/app/.tmp
      - ./.staged:/app/.staged
      - ./themes:/app/themes:ro
      - ./layouts-local:/app/layouts-local:ro
    networks:
      - presentonika_shared
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  orchestrator-worker:
    build: .
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    env_file:
      - path: .env
        required: false
    environment:
      REDIS_URL: redis://redis:6379
      FONT_FAMILY_DEFAULT: Times New Roman
      TYPOGRAPHY_SCALE: "1"
      TYPOGRAPHY_USE_THEME_SIZES: "false"
      TEXT_FIT_TRUNCATE: "false"
      LAYOUT_ENGINE_ENABLED: "true"
      LAYOUT_ENGINE_DIR: /app/layouts-local
      LAYOUT_ENGINE_FAIL_ON_MISSING_LAYOUT: "false"
      LAYOUT_ENGINE_VARIATION: "true"
      LAYOUT_DEBUG_LABEL: "true"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./out:/app/out
      - ./.tmp:/app/.tmp
      - ./.staged:/app/.staged
      - ./themes:/app/themes:ro
      - ./layouts-local:/app/layouts-local:ro
    networks:
      - presentonika_shared

volumes:
  redis_data:

networks:
  presentonika_shared:
    external: true
